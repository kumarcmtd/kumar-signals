name: Ai20-20 rules lab

# Replays Ai20-20 setups on past 5-minute candles and prints ONLY aggregate
# results to the log and the run summary. No raw price data is stored.
# v3: years of Dukascopy history (crude + gas), the last 60 days of NYMEX
# futures (Yahoo) and the app's own MCX candles. Runs by hand, or when the
# lab code changes on the development branch.
on:
  workflow_dispatch:
  push:
    branches: [claude/natural-gas-crude-oil-options-qkizj2]
    paths:
      - "scripts/twenty-lab.ts"
      - "scripts/twenty-lab-v3.ts"
      - "scripts/lab-data.ts"
      - "frontend/src/utils/twentyLab.ts"
      - "frontend/src/utils/twentyV3/**"
      - "frontend/src/utils/aiTwentyTwentyEngine.ts"
      - "frontend/src/utils/twentyV2.ts"
      - ".github/workflows/ai2020-lab.yml"

concurrency:
  group: ai2020-lab-${{ github.sha }}
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One job per market, side by side: crude's results arrive in minutes,
    # and the two downloads are not throttled behind each other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { market: CRUDEOIL, from: "2022-01-01", to: "" }
          # Holdout: five older years no rule was ever chosen on.
          - { market: CRUDEOIL, from: "2017-01-01", to: "2021-12-31" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the price-history downloader
        run: |
          mkdir -p /tmp/duka && cd /tmp/duka && npm init -y > /dev/null
          npm install dukascopy-node@1.51.1 --no-audit --no-fund
      # Downloaded price days are kept between runs here (an Actions cache,
      # never committed to the repository), so a re-run skips the download.
      - name: Restore downloaded price history
        uses: actions/cache@v4
        with:
          path: /tmp/duka-cache
          key: duka-m5-${{ matrix.market }}-${{ github.run_id }}
          restore-keys: duka-m5-${{ matrix.market }}-
      - name: Run the v3 lab
        timeout-minutes: 50
        env:
          DUKA_DIR: /tmp/duka
          DUKA_CACHE: /tmp/duka-cache
          LAB_MARKET: ${{ matrix.market }}
          LAB_FROM: ${{ matrix.from }}
          LAB_TO: ${{ matrix.to }}
        run: |
          set -o pipefail
          npx -y tsx scripts/twenty-lab-v3.ts | tee lab.md
      - name: Summary
        if: always()
        run: test -f lab.md && cat lab.md >> "$GITHUB_STEP_SUMMARY" || true
