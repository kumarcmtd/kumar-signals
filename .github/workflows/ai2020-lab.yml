name: Ai20-20 rules lab

# Replays Ai20-20 setups on past 5-minute candles and prints ONLY aggregate
# results to the log and the run summary. No raw price data is stored.
# v3: years of Dukascopy history (crude + gas), the last 60 days of NYMEX
# futures (Yahoo) and the app's own MCX candles. Runs by hand, or when the
# lab code changes on the development branch.
on:
  workflow_dispatch:
    inputs:
      group:
        description: "Rule set to run: all, v3, fast, day, lite or smart"
        default: "all"
  push:
    branches: [claude/natural-gas-crude-oil-options-qkizj2]
    paths:
      - "scripts/twenty-lab.ts"
      - "scripts/twenty-lab-v3.ts"
      - "scripts/lite-lab.ts"
      - "scripts/smart-lab.ts"
      - "frontend/src/utils/twentyV3/gapRun.ts"
      - "frontend/src/utils/lite/**"
      - "scripts/lab-data.ts"
      - "frontend/src/utils/twentyLab.ts"
      # Only the files the replay runs (not the page's wording or windows).
      - "frontend/src/utils/twentyV3/setups.ts"
      - "frontend/src/utils/twentyV3/sim.ts"
      - "frontend/src/utils/twentyV3/features.ts"
      - "frontend/src/utils/twentyV3/speed.ts"
      - "frontend/src/utils/aiTwentyTwentyEngine.ts"
      - "frontend/src/utils/twentyV2.ts"
      - ".github/workflows/ai2020-lab.yml"

concurrency:
  group: ai2020-lab-${{ github.sha }}
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One job per market, side by side: crude's results arrive in minutes,
    # and the two downloads are not throttled behind each other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { market: CRUDEOIL, from: "2022-01-01", to: "", set: "", group: v3 }
          - { market: NATURALGAS, from: "2022-01-01", to: "", set: "", group: v3 }
          # Holdout: five older years no rule was ever chosen on.
          - { market: CRUDEOIL, from: "2017-01-01", to: "2021-12-31", set: "", group: v3 }
          # Ai-Super Fast: Speed 70+ rules on the same three data sets.
          - { market: CRUDEOIL, from: "2022-01-01", to: "", set: "fast", group: fast }
          - { market: NATURALGAS, from: "2022-01-01", to: "", set: "fast", group: fast }
          - { market: CRUDEOIL, from: "2017-01-01", to: "2021-12-31", set: "fast", group: fast }
          # Ai20-20 all day: the v2 rule over every MCX hour (9:00 AM IST to 30 minutes before the bell).
          - { market: CRUDEOIL, from: "2022-01-01", to: "", set: "day", group: day }
          - { market: NATURALGAS, from: "2022-01-01", to: "", set: "day", group: day }
          - { market: CRUDEOIL, from: "2017-01-01", to: "2021-12-31", set: "day", group: day }
          # Ai Lite: three plain rules, Rs 2,000 target (its own script).
          - { market: CRUDEOIL, from: "2022-01-01", to: "", set: "lite", group: lite, script: "scripts/lite-lab.ts" }
          - { market: NATURALGAS, from: "2022-01-01", to: "", set: "lite", group: lite, script: "scripts/lite-lab.ts" }
          - { market: CRUDEOIL, from: "2017-01-01", to: "2021-12-31", set: "lite", group: lite, script: "scripts/lite-lab.ts" }
          # Smart Ai20-20: v2 with a recent-record switch, and the run-to-the-recent-high setups.
          - { market: CRUDEOIL, from: "2022-01-01", to: "", set: "smart", group: smart, script: "scripts/smart-lab.ts" }
          - { market: NATURALGAS, from: "2022-01-01", to: "", set: "smart", group: smart, script: "scripts/smart-lab.ts" }
          - { market: CRUDEOIL, from: "2017-01-01", to: "2021-12-31", set: "smart", group: smart, script: "scripts/smart-lab.ts" }
          - { market: NATURALGAS, from: "2017-01-01", to: "2021-12-31", set: "smart", group: smart, script: "scripts/smart-lab.ts" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the price-history downloader
        run: |
          mkdir -p /tmp/duka && cd /tmp/duka && npm init -y > /dev/null
          npm install dukascopy-node@1.51.1 --no-audit --no-fund
      # Downloaded price days are kept between runs here (an Actions cache,
      # never committed to the repository), so a re-run skips the download.
      - name: Restore downloaded price history
        uses: actions/cache@v4
        with:
          path: /tmp/duka-cache
          key: duka-m5-${{ matrix.market }}-${{ github.run_id }}
          restore-keys: duka-m5-${{ matrix.market }}-
      - name: Run the v3 lab
        # A hand-started run can pick one rule set; the others finish at once.
        if: github.event_name != 'workflow_dispatch' || inputs.group == 'all' || inputs.group == matrix.group
        timeout-minutes: 50
        env:
          DUKA_DIR: /tmp/duka
          DUKA_CACHE: /tmp/duka-cache
          LAB_MARKET: ${{ matrix.market }}
          LAB_FROM: ${{ matrix.from }}
          LAB_TO: ${{ matrix.to }}
          LAB_SET: ${{ matrix.set }}
        run: |
          set -o pipefail
          npx -y tsx ${{ matrix.script || 'scripts/twenty-lab-v3.ts' }} | tee lab.md
      - name: Summary
        if: always()
        run: test -f lab.md && cat lab.md >> "$GITHUB_STEP_SUMMARY" || true
